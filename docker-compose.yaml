services:
  rpg:
    build: .
    container_name: rpg-deck-builder
    restart: unless-stopped
    ports:
      - "3060:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rpg.rule=Host(`rpg.mxglab.com`)"
      - "traefik.http.routers.rpg.entrypoints=https"
      - "traefik.http.routers.rpg.tls=true"
      - "traefik.http.services.rpg.loadbalancer.server.port=80"

networks:
  default:
    name: coolify
    external: true
